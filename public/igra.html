<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4cc">
<title>Выжил бы ты?</title>
<meta name="description" content="Игра о военно-полевой медицине России, Китая, Японии и Кореи с XVIII века до наших дней">
<style>
/* «Выжил бы ты?» — бумага, сепия, тёмно-красные акценты. Без внешних шрифтов. */
:root {
  --paper: #f3ead6;
  --paper-2: #e9dcbf;
  --card: #fbf6ea;
  --ink: #33271c;
  --ink-soft: #6a5844;
  --line: #cdb994;
  --red: #8b1e1e;
  --red-dark: #6a1414;
  --green: #44613a;
  --amber: #9a6a1a;
  --grey: #5d5650;
  --radius: 14px;
  --serif: Georgia, "Times New Roman", "PT Serif", "Noto Serif", serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(ellipse at 100% 100%, rgba(150,110,60,.14), transparent 55%),
    repeating-linear-gradient(0deg, rgba(120,90,50,.025) 0 2px, transparent 2px 4px);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.5;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
}

h1, h2, h3 { font-weight: normal; line-height: 1.2; margin: 0 0 12px; }
h1 { font-size: 34px; letter-spacing: .5px; }
h2 { font-size: 26px; }
h3 { font-size: 20px; }
p  { margin: 0 0 12px; }

/* верхняя полоска */
.topbar {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 16px; min-height: 44px;
}
.topbar .where { flex: 1; color: var(--ink-soft); font-size: 15px; text-align: right; }
.back {
  appearance: none; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font: inherit; font-size: 16px;
  padding: 8px 14px; border-radius: 999px; min-height: 44px; cursor: pointer;
}

/* титул */
.hero { text-align: center; padding: 28px 4px 8px; }
.hero .kicker { color: var(--red); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
.hero h1 { font-size: 42px; margin-bottom: 14px; }
.hero .lead { color: var(--ink-soft); font-size: 18px; }
.ornament { color: var(--red); text-align: center; letter-spacing: 8px; margin: 14px 0; font-size: 18px; }

/* карточки */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin: 0 0 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 6px rgba(90,60,30,.08);
}
.card.accent { border-left: 5px solid var(--red); }
.muted { color: var(--ink-soft); }
.small { font-size: 15px; }

/* кнопки */
.btn {
  display: block; width: 100%;
  appearance: none; cursor: pointer;
  font: inherit; font-size: 19px; line-height: 1.3; text-align: center;
  padding: 16px 18px; min-height: 60px;
  border-radius: var(--radius);
  border: 2px solid var(--red);
  background: var(--red); color: #fff8ee;
  margin: 0 0 12px;
  transition: transform .08s ease, background .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.98); background: var(--red-dark); }
.btn.ghost { background: transparent; color: var(--red); }
.btn.ghost:active { background: rgba(139,30,30,.08); }
.btn:focus-visible, .choice:focus-visible, .pick:focus-visible, .chip:focus-visible, .back:focus-visible {
  outline: 3px solid #c58a2a; outline-offset: 2px;
}

/* выбор страны / сценария */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.pick {
  appearance: none; cursor: pointer; font: inherit; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 12px; min-height: 120px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
.pick:active { background: var(--paper-2); }
.pick .name { font-size: 20px; }
.pick .count { font-size: 14px; color: var(--ink-soft); }

.seal {
  width: 52px; height: 52px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--red); color: var(--red);
  font-size: 26px; line-height: 1; background: rgba(139,30,30,.05);
  flex: none;
}
.seal.sm { width: 36px; height: 36px; font-size: 18px; border-width: 1.5px; }

.scen {
  appearance: none; cursor: pointer; font: inherit; color: var(--ink); text-align: left;
  width: 100%; display: flex; gap: 14px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 12px; min-height: 88px;
  -webkit-tap-highlight-color: transparent;
}
.scen:active { background: var(--paper-2); }
.scen .year { font-size: 22px; line-height: 1.15; color: var(--red); width: 80px; flex: none; }
.scen .body { flex: 1; }
.scen .t { font-size: 19px; display: block; }
.scen .s { font-size: 15px; color: var(--ink-soft); display: block; }
.tag {
  display: inline-block; font-size: 13px; letter-spacing: .5px;
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--ink-soft); margin-top: 4px; background: var(--paper);
}
.tag.done-ok  { border-color: var(--green); color: var(--green); }
.tag.done-mid { border-color: var(--amber); color: var(--amber); }
.tag.done-bad { border-color: var(--grey);  color: var(--grey); }

/* шаги */
.progress { display: flex; gap: 6px; margin: 0 0 14px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--paper-2); border: 1px solid var(--line); }
.progress span.on { background: var(--red); border-color: var(--red); }
.question { font-size: 22px; margin: 4px 0 16px; }
.choice {
  appearance: none; cursor: pointer; font: inherit; color: var(--ink);
  display: flex; gap: 12px; align-items: center; text-align: left;
  width: 100%; min-height: 64px; padding: 14px 16px; margin: 0 0 12px;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
  font-size: 18px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
}
.choice:active { border-color: var(--red); background: #fff; }
.choice .num {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--red); color: var(--red);
  display: inline-flex; align-items: center; justify-content: center; font-size: 16px;
}
.chosen { font-style: italic; color: var(--ink-soft); border-left: 3px solid var(--line); padding-left: 12px; margin-bottom: 14px; }

/* итог */
.verdict { text-align: center; padding: 24px 18px; }
.verdict .mark {
  width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; border: 3px solid currentColor;
}
.verdict.ok  { color: var(--green); }
.verdict.mid { color: var(--amber); }
.verdict.bad { color: var(--grey); }
.verdict h2 { color: inherit; }
.verdict p { color: var(--ink); }

.decisions { list-style: none; padding: 0; margin: 0; }
.decisions li { padding: 10px 0; border-top: 1px dashed var(--line); }
.decisions li:first-child { border-top: 0; padding-top: 0; }
.decisions .q { font-size: 15px; color: var(--ink-soft); }
.decisions .a { display: block; }
.decisions .note { font-size: 15px; display: block; margin-top: 4px; }
.lbl { font-size: 13px; letter-spacing: .5px; padding: 1px 8px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }
.lbl.r0 { background: rgba(68,97,58,.12);  color: var(--green); }
.lbl.r1 { background: rgba(154,106,26,.14); color: var(--amber); }
.lbl.r2 { background: rgba(139,30,30,.10);  color: var(--red); }

.rules { margin: 0; padding-left: 22px; }
.rules li { margin-bottom: 6px; }
.sources { font-size: 14px; color: var(--ink-soft); margin: 0; padding-left: 18px; }
.sources li { margin-bottom: 4px; }
.section-title { color: var(--red); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 8px; }

/* лента времени */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.chip {
  appearance: none; cursor: pointer; font: inherit; font-size: 16px;
  padding: 8px 14px; min-height: 44px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.chip.on { background: var(--red); border-color: var(--red); color: #fff8ee; }

.tl { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; }
.tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl li { position: relative; margin: 0 0 14px; }
.tl li::before {
  content: ""; position: absolute; left: -23px; top: 8px;
  width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--red);
}
.tl .y { font-size: 20px; color: var(--red); }
.tl .c { font-size: 13px; color: var(--ink-soft); letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; }
.tl .x { margin-top: 2px; }

.footer { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 24px; }

/* ---------- счёт в шапке ---------- */
.score {
  flex: none; display: inline-flex; gap: 6px; align-items: center;
  font-size: 15px; line-height: 1;
}
.score .sc {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  white-space: nowrap;
}
.score .sc.ok { color: var(--green); }
.score .sc.life { color: var(--red); }
.score .sc b { font-weight: normal; color: var(--ink); }
.score .sc.bump { animation: bump .5s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); background: #fff; } 100% { transform: scale(1); } }
.home-score { text-align: center; color: var(--ink-soft); font-size: 16px; margin: -4px 0 14px; }
.link {
  display: block; margin: 4px auto 0; appearance: none; background: none; border: 0; cursor: pointer;
  font: inherit; font-size: 14px; color: var(--ink-soft); text-decoration: underline; padding: 10px; min-height: 44px;
}

/* ---------- мгновенная реакция на выбор ---------- */
.play-card { margin-bottom: 4px; }
.choice { transition: background .2s ease, border-color .2s ease, opacity .2s ease, color .2s ease; }
.choice:disabled { cursor: default; }
.choice.dim { opacity: .5; }
.choice.dim.is-best { opacity: 1; border-style: dashed; border-color: var(--green); }
.choice.picked { opacity: 1; }
.choice.picked .num { font-weight: bold; color: #fff; }
.choice.g-good  { border-color: var(--green); background: #e7efdf; }
.choice.g-good .num  { background: var(--green); border-color: var(--green); }
.choice.g-risky { border-color: var(--amber); background: #f6ead0; }
.choice.g-risky .num { background: var(--amber); border-color: var(--amber); }
.choice.g-bad   { border-color: var(--red); background: #f5e0dc; }
.choice.g-bad .num   { background: var(--red); border-color: var(--red); }
.choice.pulse { animation: pulse .6s ease-out; }
@keyframes pulse {
  0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(68,97,58,.45); }
  45%  { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(68,97,58,0); }
  100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(68,97,58,0); }
}
.play-card.shake { animation: shake .45s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(2px); }
}

.feedback {
  display: flex; gap: 12px; align-items: flex-start;
  border-radius: var(--radius); padding: 14px 16px; margin: 4px 0 14px;
  border: 2px solid; background: var(--card);
}
.feedback.in { animation: fbin .35s ease-out; }
@keyframes fbin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.feedback.g-good  { border-color: var(--green); background: #eef4e8; }
.feedback.g-risky { border-color: var(--amber); background: #faf0dc; }
.feedback.g-bad   { border-color: var(--red);   background: #f9e8e4; }
.fb-icon {
  flex: none; width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px; font-weight: bold;
}
.g-good  .fb-icon { background: var(--green); }
.g-risky .fb-icon { background: var(--amber); }
.g-bad   .fb-icon { background: var(--red); }
.fb-body { flex: 1; min-width: 0; }
.fb-title { font-size: 19px; margin: 4px 0 6px; }
.g-good  .fb-title { color: var(--green); }
.g-risky .fb-title { color: var(--amber); }
.g-bad   .fb-title { color: var(--red); }
.fb-why { margin: 0; }
.fb-hint { margin: 8px 0 0; font-size: 16px; color: var(--green); }

/* полоска прогресса: цвет пройденных шагов */
.progress span.g-good  { background: var(--green); border-color: var(--green); }
.progress span.g-risky { background: var(--amber); border-color: var(--amber); }
.progress span.g-bad   { background: var(--red);   border-color: var(--red); }

/* звёзды на итоге */
.stars { display: flex; justify-content: center; gap: 6px; margin: 14px 0 4px; font-size: 40px; line-height: 1; }
.star { color: var(--line); }
.star.on { color: #c58a2a; text-shadow: 0 1px 0 rgba(90,60,30,.25); }
.stars.in .star { animation: starpop .45s ease-out both; animation-delay: var(--d, 0s); }
@keyframes starpop { 0% { opacity: 0; transform: scale(.3) rotate(-30deg); } 70% { transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
.star-note { color: var(--ink-soft) !important; font-size: 16px; margin: 0; }

@media (max-width: 400px) {
  .topbar { gap: 6px; }
  .topbar .where { font-size: 13px; }
  .back { padding: 8px 10px; }
  .score .sc { padding: 5px 7px; }
}
@media (min-width: 600px) {
  #app { padding-top: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* программный фокус на заголовке (для экранных дикторов) без рамки */
h1:focus, h2:focus { outline: none; }

</style>
</head>
<body>
<main id="app" aria-live="polite">
  <noscript><p class="card">Для игры нужно включить JavaScript.</p></noscript>
</main>
<script>
/*
  ДАННЫЕ ИГРЫ «ВЫЖИЛ БЫ ТЫ?»
  ===========================
  Здесь лежат все тексты: сценарии, лента времени и современные правила.
  Править можно прямо в этом файле (Блокнотом), код игры трогать не нужно.

  Как устроен сценарий:
  - id, country (russia / china / japan / korea), year, title, kind ("Ранение", "Болезнь", "Травма" и т. п.), short — подпись в списке;
  - intro — вступление;
  - steps — шаги. У каждого шага question (вопрос) и 3 варианта choices.
    У варианта:
      text  — что делает игрок,
      res   — что из этого вышло (показывается сразу),
      risk  — 0 = верно, 1 = рискованно, 2 = ошибка (очки риска складываются),
      end   — (необязательно) сразу закончить игру: "bad" (погиб) или "mid";
      next  — (необязательно) "end" = больше шагов не будет.
  - Итог по сумме риска: 0–1 → ok (выжил), 2–3 → mid, 4 и больше → bad.
    Если вариант задаёт end, берётся худший из двух исходов.
  - ends.ok / ends.mid / ends.bad — заголовок и текст итога;
  - then — как было правильно в ту эпоху в той стране;
  - now — как делают сейчас (дополняет общие правила modernRules внизу);
  - sources — 1–2 источника из списков в папке «материалы».

  Факты взяты ТОЛЬКО из материалы/*.md и текст/*.md (главы 1.1–1.5, 2.1).
*/

window.GAME_DATA = {
  countries: {
    russia: { name: "Россия", seal: "Р" },
    china:  { name: "Китай",  seal: "中" },
    japan:  { name: "Япония", seal: "日" },
    korea:  { name: "Корея",  seal: "韓" }
  },

  scenarios: [

    /* ---------------- 1. Россия, 1812 ---------------- */
    {
      id: "ru1812",
      country: "russia",
      year: "1812",
      title: "Бородинское сражение",
      kind: "Ранение",
      short: "Штыковая рана бедра",
      intro: "1812 год, Отечественная война, Бородинское сражение. Ты — солдат пехотного полка. Твоего товарища ранило штыком в бедро. Рана сильно кровоточит, идти сам он не может. Бой ещё идёт.",
      steps: [
        {
          question: "Что ты сделаешь первым?",
          choices: [
            { text: "Прижать рану тканью и туго перевязать",
              res: "Ты плотно прижимаешь рану и туго перевязываешь её. Кровь идёт заметно слабее — у товарища есть время дождаться помощи.",
              risk: 0 },
            { text: "Сразу тащить его с поля, рану не трогать",
              res: "Ты выносишь товарища из-под огня, но всю дорогу рана кровоточит. Он слабеет.",
              risk: 1 },
            { text: "Оставить его — после боя подберут",
              res: "Бой длится долго. Всё это время рана кровоточит, и помощь приходит поздно.",
              risk: 2 }
          ]
        },
        {
          question: "Куда доставить раненого?",
          choices: [
            { text: "На полковой перевязочный пункт у поля боя",
              res: "Под Бородином работали до восьми полковых перевязочных пунктов — 2–3 палатки или просто место на земле. Лекарь перевязывает рану: на одного раненого полагалось около полфунта корпии и до трёх аршин бинтов.",
              risk: 0 },
            { text: "Сразу везти в подвижный госпиталь в Можайск",
              res: "Подвижный (корпусной) госпиталь стоял в Можайске, в 15–20 верстах. Ехать на телеге без перевязки долго — раненый теряет силы в дороге.",
              risk: 2 },
            { text: "Отнести в ближайшую деревню к крестьянам",
              res: "Крестьяне дают воды и укрывают раненого, но лекаря здесь нет. Рану толком никто не обработал.",
              risk: 2 }
          ]
        },
        {
          question: "Лекарь говорит: рана глубокая, нужна срочная операция. Как быть?",
          choices: [
            { text: "Везти конным обозом в развозной (дивизионный) госпиталь у места боя",
              res: "В развозном госпитале как раз делали срочные операции. Наркоза ещё нет — его впервые применят в России только в 1847 году, — но операцию делают вовремя.",
              risk: 0 },
            { text: "Оставить на перевязочном пункте — вдруг заживёт само",
              res: "Раненых на пункте всё больше. Без операции рана может воспалиться.",
              risk: 1 },
            { text: "Сразу во временный госпиталь за 80–100 вёрст",
              res: "Временный госпиталь — для долгого лечения, а не для срочных операций. Путь занимает много дней.",
              risk: 1 }
          ]
        }
      ],
      ends: {
        ok:  { title: "Товарищ выжил",
               text: "Его вовремя перевязали и прооперировали. После лечения он, скорее всего, смог вернуться в строй." },
        mid: { title: "Выжил, но лечился долго",
               text: "Помощь пришла с опозданием. Товарищ выжил, но лечение затянулось на месяцы, и в строй он мог уже не вернуться." },
        bad: { title: "Раненый не выжил",

    { year: "1884",      country: "korea",  text: "Переворот Капсин: американский врач Хорас Аллен спасает тяжело раненого вельможу Мин Ёнъика." },
    { year: "1885",      country: "korea", text: "В Сеуле открыт Чеджунвон — первая больница западного типа (американский врач Хорас Аллен)." },
    { year: "1887",      country: "japan",  text: "Хакуайся переименовано в Японское общество Красного Креста (Япония вошла в Женевскую конвенцию в 1886 году)." },
    { year: "1894–1895", country: "japan",  text: "Японо-китайская война: погибших в бою мало, но около 67 тысяч случаев бери-бери и более 10 тысяч смертей от неё." },
    { year: "1902",      country: "china",  text: "Юань Шикай основывает в Тяньцзине Бэйянскую военно-медицинскую школу; с 1906 года — четыре года обучения." },
    { year: "1903",      country: "korea",  text: "Первый выпуск государственной медицинской школы: из 19 выпускников 18 стали военными врачами." },
    { year: "1904",      country: "china",  text: "Шанхайские предприниматели создают первое китайское общество Красного Креста; его признают в Женеве в 1912 году." },
    { year: "1904–1905", country: "russia", text: "Русско-японская война: впервые индивидуальные перевязочные пакеты и само- и взаимопомощь; 80 военно-санитарных поездов, но остро не хватает повозок." },
    { year: "1904–1905", country: "japan",  text: "У каждого японского солдата асептический пакет; инфекции — лишь 3,51 % больных, но бери-бери — 24,3 % всех больных и раненых." },
    { year: "1907",      country: "korea",  text: "Японцы распускают корейскую армию; 3 сентября уволено большинство корейских военных врачей." },
    { year: "1910–1911", country: "china",  text: "Лёгочная чума в Маньчжурии. У Ляньдэ останавливает её масками, изоляцией и дезинфекцией; погибло около 60 тысяч человек." },
    { year: "1916",      country: "russia", text: "В. А. Оппель предлагает «этапное лечение»: приблизить хирургическую помощь к раненым и совмещать лечение с эвакуацией." },
    { year: "1933",      country: "russia", text: "Устав военно-санитарной службы РККА закрепляет этапное лечение с эвакуацией по назначению." },
    { year: "1937–1943", country: "china",  text: "Война с Японией: Красный Крест и Роберт Лим создают медицинские бригады и школы; к 1943 году складывается армейская медслужба из трёх звеньев." },
    { year: "1938–1939", country: "china",  text: "Норман Бетьюн в Северном Китае: переносная операционная на двух мулах, курсы для медиков." },
    { year: "1941–1945", country: "russia", text: "Великая Отечественная война. Медслужбой руководит Е. И. Смирнов. По разным данным, в строй вернули около 72 % раненых и 86–91 % больных." },
    { year: "1950–1953", country: "korea",  text: "Корейская война: первая массовая эвакуация раненых вертолётами и передвижные хирургические госпитали MASH." },
    { year: "Наше время", country: "russia", text: "Тактическая медицина: обучение само- и взаимопомощи, индивидуальная аптечка со жгутом, быстрая эвакуация." }
  ]
};

</script>
<script>
/* «Выжил бы ты?» — логика игры. Тексты лежат в data.js. */
(function () {
  "use strict";

  var D = window.GAME_DATA;
  var app = document.getElementById("app");
  var STORE_KEY = "vyzhil-results-v1";
  var SCORE_KEY = "vyzhil-score-v1";

  /* ---------- мелочи ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function byId(id) {
    for (var i = 0; i < D.scenarios.length; i++) if (D.scenarios[i].id === id) return D.scenarios[i];
    return null;
  }
  function loadResults() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveResult(id, type) {
    try { var r = loadResults(); r[id] = type; localStorage.setItem(STORE_KEY, JSON.stringify(r)); } catch (e) {}
  }
  /* счёт: верные решения и спасённые жизни (хранится в браузере, если можно) */
  var scoreMem = { correct: 0, saved: 0 };
  function loadScore() {
    try {
      var s = JSON.parse(localStorage.getItem(SCORE_KEY));
      if (s && typeof s.correct === "number") scoreMem = { correct: s.correct, saved: s.saved || 0 };
    } catch (e) {}
    return scoreMem;
  }
  function addScore(field) {
    var s = loadScore();
    s[field]++;
    scoreMem = s;
    try { localStorage.setItem(SCORE_KEY, JSON.stringify(s)); } catch (e) {}
    var el = document.querySelector(".score [data-f='" + field + "']");
    if (el) {
      el.textContent = s[field];
      var box = el.parentNode;
      box.classList.remove("bump");
      void box.offsetWidth; // перезапуск анимации
      box.classList.add("bump");
    }
  }
  function resetScore() {
    scoreMem = { correct: 0, saved: 0 };
    try { localStorage.removeItem(SCORE_KEY); localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function go(hash) {
    if (location.hash === hash) route(); else location.hash = hash;
  }
  function render(html) {
    app.innerHTML = html;
    window.scrollTo(0, 0);
    var h = app.querySelector("h1, h2");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }
  function scoreBadge() {
    var s = loadScore();
    return '<span class="score" title="Верные решения и спасённые жизни">' +
      '<span class="sc ok" aria-label="Верных решений"><span aria-hidden="true">✓</span> <b data-f="correct">' + s.correct + "</b></span>" +
      '<span class="sc life" aria-label="Спасено жизней"><span aria-hidden="true">♥</span> <b data-f="saved">' + s.saved + "</b></span></span>";
  }
  function topbar(backHash, where) {
    return '<div class="topbar"><button class="back" data-go="' + backHash + '">← Назад</button>' +
      '<span class="where">' + esc(where || "") + "</span>" + scoreBadge() + "</div>";
  }
  var OUT_LABEL = { ok: "выжил", mid: "с последствиями", bad: "погиб" };
  var OUT_MARK = { ok: "✓", mid: "!", bad: "✕" };
  var RISK_LABEL = ["верно", "рискованно", "ошибка"];
  var NUMS = ["1", "2", "3", "4"];

  /* оценка одного выбора: good / risky / bad */
  function grade(ch) {
    var r = ch.risk || 0;
    if (ch.end === "bad" || r >= 2) return "bad";
    if (r === 1 || ch.end === "mid") return "risky";
    return "good";
  }
  function bestOf(st) {
    return st.choices.filter(function (c) { return (c.risk || 0) === 0 && !c.end; })[0] || null;
  }

  /* ---------- экраны ---------- */
  function home() {
    var s = loadScore();
    render(
      '<section class="hero">' +
        '<div class="kicker">Военно-полевая медицина</div>' +
        "<h1>Выжил бы ты?</h1>" +
        '<p class="lead">Россия, Китай, Япония и Корея — с XVIII века до наших дней. Выбери страну и эпоху, а потом сам реши, как помочь раненому.</p>' +
      "</section>" +
      '<div class="ornament">✠ ✠ ✠</div>' +
      (s.correct || s.saved ?
        '<p class="home-score">Твой счёт: <b>' + s.correct + "</b> " + plural(s.correct, "верное решение", "верных решения", "верных решений") +
        " · спасено <b>" + s.saved + "</b> " + plural(s.saved, "жизнь", "жизни", "жизней") + "</p>" : "") +
      '<button class="btn" data-go="#/countries">Начать игру</button>' +
      '<button class="btn ghost" data-go="#/timeline">Лента времени</button>' +
      '<button class="btn ghost" data-go="#/about">Об игре</button>' +
      (s.correct || s.saved ? '<button class="link" data-act="reset">Сбросить счёт и пройденные истории</button>' : "") +
      '<p class="footer">Продукт школьного исследовательского проекта о тактической медицине.<br>Все факты — из глав 1.1–1.5 и 2.1 работы.</p>'
    );
  }

  function countries() {
    var res = loadResults();
    var html = topbar("#/", "Шаг 1 из 2") + "<h2>Выбери страну</h2>" + '<div class="grid2">';
    Object.keys(D.countries).forEach(function (key) {
      var c = D.countries[key];
      var list = D.scenarios.filter(function (s) { return s.country === key; });
      var done = list.filter(function (s) { return res[s.id]; }).length;
      html += '<button class="pick" data-go="#/c/' + key + '">' +
        '<span class="seal" aria-hidden="true">' + esc(c.seal) + "</span>" +
        '<span class="name">' + esc(c.name) + "</span>" +
        '<span class="count">' + list.length + " " + plural(list.length, "история", "истории", "историй") +
        (done ? " · пройдено " + done : "") + "</span></button>";
    });
    html += "</div>";
    render(html);
  }

  function plural(n, a, b, c) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b;
    return c;
  }

  function scenarioList(key) {
    var c = D.countries[key];
    if (!c) return go("#/countries");
    var res = loadResults();
    var html = topbar("#/countries", "Шаг 2 из 2") +
      '<h2><span class="seal sm" aria-hidden="true">' + esc(c.seal) + "</span> " + esc(c.name) + "</h2>" +
      '<p class="muted">Выбери эпоху и что случилось.</p>';
    D.scenarios.filter(function (s) { return s.country === key; }).forEach(function (s) {
      var r = res[s.id];
      html += '<button class="scen" data-go="#/s/' + s.id + '">' +
        '<span class="year">' + esc(s.year) + "</span>" +
        '<span class="body"><span class="t">' + esc(s.title) + "</span>" +
        '<span class="s">' + esc(s.short) + "</span>" +
        '<span class="tag">' + esc(s.kind) + "</span> " +
        (r ? '<span class="tag done-' + r + '">пройдено: ' + OUT_LABEL[r] + "</span>" : "") +
        "</span></button>";
    });
    render(html);
  }

  /* ---------- игра ---------- */
  var play = null; // { s, step, risk, forced, path: [{step, choice}], pending: индекс выбора или null }

  function intro(id) {
    var s = byId(id);
    if (!s) return go("#/countries");
    var c = D.countries[s.country];
    render(
      topbar("#/c/" + s.country, c.name + " · " + s.year) +
      '<div class="card accent">' +
        '<div class="section-title">' + esc(s.kind) + "</div>" +
        "<h2>" + esc(s.title) + "</h2>" +
        "<p>" + esc(s.intro) + "</p>" +
      "</div>" +
      '<p class="muted small">Впереди ' + s.steps.length + " " + plural(s.steps.length, "решение", "решения", "решений") +
      ". После каждого сразу увидишь, верно ли ты поступил.</p>" +
      '<button class="btn" data-act="start" data-id="' + s.id + '">Помочь раненому</button>'
    );
  }

  function start(id) {
    play = { s: byId(id), step: 0, risk: 0, forced: null, path: [], pending: null, correct: 0 };
    go("#/play");
  }

  function showStep() {
    if (!play) return go("#/countries");
    if (play.done) return go("#/s/" + play.s.id);
    var s = play.s, st = s.steps[play.step];
    var html = topbar("#/s/" + s.id, D.countries[s.country].name + " · " + s.year) + progress();
    html += '<div class="play-card"><p class="question">' + esc(st.question) + "</p>";
    st.choices.forEach(function (ch, i) {
      html += '<button class="choice" data-act="choose" data-i="' + i + '"><span class="num" aria-hidden="true">' + NUMS[i] + "</span>" +
        '<span class="txt">' + esc(ch.text) + "</span></button>";
    });
    html += '</div><div class="fb-slot"></div>';
    render(html);
    if (play.pending !== null) showFeedback(play.pending, false); // вернулись назад-вперёд — показать уже сделанный выбор
  }

  function progress() {
    var html = '<div class="progress" aria-label="Шаг ' + (play.step + 1) + " из " + play.s.steps.length + '">';
    for (var i = 0; i < play.s.steps.length; i++) {
      var cls = "";
      var p = play.path[i];
      if (p) cls = "g-" + grade(play.s.steps[p.step].choices[p.choice]);
      else if (i === play.step) cls = "on";
      html += "<span" + (cls ? ' class="' + cls + '"' : "") + "></span>";
    }
    return html + "</div>";
  }

  var FB = {
    good:  { icon: "✓", title: "Верно!" },
    risky: { icon: "!", title: "Рискованно" },
    bad:   { icon: "✕", title: "Ошибка — так нельзя" }
  };

  function choose(i) {
    if (!play || play.pending !== null) return;
    var st = play.s.steps[play.step], ch = st.choices[i];
    play.pending = i;
    play.path.push({ step: play.step, choice: i });
    play.risk += ch.risk || 0;
    if (ch.end) play.forced = worst(play.forced, ch.end);
    play.finished = !!(ch.end || ch.next === "end" || play.step >= play.s.steps.length - 1);
    if (grade(ch) === "good") { play.correct++; addScore("correct"); }
    showFeedback(i, true);
  }

  function showFeedback(i, animate) {
    var st = play.s.steps[play.step], ch = st.choices[i], g = grade(ch), best = bestOf(st);
    var motion = animate && !reducedMotion();
    var btns = app.querySelectorAll(".choice");
    for (var k = 0; k < btns.length; k++) {
      var b = btns[k];
      b.disabled = true;
      b.setAttribute("aria-disabled", "true");
      if (k === i) {
        b.classList.add("picked", "g-" + g);
        b.querySelector(".num").textContent = FB[g].icon;
        if (motion && g === "good") b.classList.add("pulse");
      } else {
        b.classList.add("dim");
        if (g !== "good" && best && st.choices[k] === best) b.classList.add("is-best");
      }
    }
    // строка «почему» + подсказка
    var why = ch.res;
    var hint = "";
    if (g !== "good" && best) hint = '<p class="fb-hint"><span aria-hidden="true">→</span> Лучше было: «' + esc(best.text) + "»</p>";
    var title = (g === "risky" && ch.end === "mid" && !ch.risk) ? "Так тогда делали часто, но был способ лучше" : FB[g].title;
    var html = '<div class="feedback g-' + g + (motion ? " in" : "") + '" role="status">' +
      '<span class="fb-icon" aria-hidden="true">' + FB[g].icon + "</span>" +
      '<div class="fb-body"><p class="fb-title">' + esc(title) + "</p>" +
      '<p class="fb-why">' + esc(why) + "</p>" + hint + "</div></div>" +
      '<button class="btn next-btn" data-act="next">' + (play.finished ? "Чем всё кончилось?" : "Дальше →") + "</button>";
    var slot = app.querySelector(".fb-slot");
    slot.innerHTML = html;
    if (motion && g === "bad") {
      var card = app.querySelector(".play-card");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }
    // обновить полоску прогресса (цвет шага)
    var bar = app.querySelector(".progress");
    if (bar) bar.outerHTML = progress();
    var nb = slot.querySelector(".next-btn");
    if (animate) {
      try { slot.scrollIntoView({ behavior: motion ? "smooth" : "auto", block: "nearest" }); } catch (e) { slot.scrollIntoView(false); }
      if (nb) nb.focus({ preventScroll: true });
    }
  }

  function next() {
    if (!play) return go("#/countries");
    if (play.pending === null) return showStep();
    play.pending = null;
    if (play.finished) return result();
    play.step++;
    showStep();
  }

  var ORDER = { ok: 0, mid: 1, bad: 2 };
  function worst(a, b) {
    if (!a) return b; if (!b) return a;
    return ORDER[a] >= ORDER[b] ? a : b;
  }

  function starsFor(correct, total) {
    if (correct >= total) return 3;
    if (correct >= total - 1 && correct > 0) return 2;
    return 1;
  }

  function result() {
    var s = play.s;
    if (play.done) return go("#/s/" + s.id);
    play.done = true;
    var byRisk = play.risk <= 1 ? "ok" : play.risk <= 3 ? "mid" : "bad";
    var out = worst(byRisk, play.forced);
    var end = s.ends[out];
    saveResult(s.id, out);
    if (out === "ok") addScore("saved");

    var total = s.steps.length, stars = starsFor(play.correct, total);
    var motion = !reducedMotion();
    var starHtml = '<div class="stars' + (motion ? " in" : "") + '" role="img" aria-label="' + stars + " из 3 звёзд\">";
    for (var k = 0; k < 3; k++) starHtml += '<span class="star' + (k < stars ? " on" : "") + '" style="--d:' + (k * 0.18) + 's">★</span>';
    starHtml += "</div>";
    var starNote = stars === 3 ? "Все решения верные!" :
      "Верных решений: " + play.correct + " из " + total + (stars === 2 ? " — почти идеально." : ". Попробуй ещё раз!");

    var html = topbar("#/c/" + s.country, D.countries[s.country].name + " · " + s.year);
    html += '<div class="card verdict ' + out + '"><div class="mark" aria-hidden="true">' + OUT_MARK[out] + "</div>" +
      '<div class="section-title">Итог</div><h2>' + esc(end.title) + "</h2><p>" + esc(end.text) + "</p>" +
      starHtml + '<p class="star-note">' + esc(starNote) + "</p></div>";

    html += '<div class="card"><div class="section-title">Твои решения</div><ul class="decisions">';
    play.path.forEach(function (p) {
      var st = s.steps[p.step], ch = st.choices[p.choice], r = ch.risk || 0;
      var best = bestOf(st);
      html += "<li><span class=\"q\">" + esc(st.question) + "</span>" +
        '<span class="a"><span class="lbl r' + r + '">' + RISK_LABEL[r] + "</span>" + esc(ch.text) + "</span>" +
        (r > 0 && best ? '<span class="note">Лучше было: ' + esc(best.text) + "</span>" : "") +
        (r === 0 && ch.end === "mid" && best ? '<span class="note">Так тогда поступали часто, но был способ сохранить ногу: ' + esc(best.text) + "</span>" : "") +
        "</li>";
    });
    html += "</ul></div>";

    html += '<div class="card accent"><div class="section-title">Как было правильно тогда</div><p>' + esc(s.then) + "</p></div>";

    html += '<div class="card"><div class="section-title">Как делают сейчас</div><p>' + esc(s.now) + "</p>" +
      '<p class="muted small">Общие правила первой помощи:</p><ol class="rules">';
    D.modernRules.forEach(function (r) { html += "<li>" + esc(r) + "</li>"; });
    html += "</ol></div>";

    html += '<div class="card"><div class="section-title">Источник</div><ul class="sources">';
    s.sources.forEach(function (src) { html += "<li>" + esc(src) + "</li>"; });
    html += "</ul></div>";

    html += '<button class="btn" data-act="start" data-id="' + s.id + '">Сыграть ещё раз</button>' +
      '<button class="btn ghost" data-go="#/countries">Другая страна или эпоха</button>' +
      '<button class="btn ghost" data-go="#/timeline">Лента времени</button>';
    render(html);
  }

  /* ---------- лента времени ---------- */
  var tlFilter = "all";
  function timeline() {
    var html = topbar("#/", "") + "<h2>Лента времени</h2>" +
      '<p class="muted small">Ключевые события военной медицины четырёх стран.</p><div class="chips" role="group" aria-label="Фильтр по стране">';
    html += chip("all", "Все");
    Object.keys(D.countries).forEach(function (k) { html += chip(k, D.countries[k].name); });
    html += '</div><ol class="tl">';
    D.timeline.forEach(function (e) {
      if (tlFilter !== "all" && e.country !== tlFilter) return;
      html += '<li><span class="y">' + esc(e.year) + '</span><span class="c">' + esc(D.countries[e.country].name) + "</span>" +
        '<div class="x">' + esc(e.text) + "</div></li>";
    });
    html += "</ol>" + '<button class="btn" data-go="#/countries">Сыграть</button>';
    render(html);
  }
  function chip(key, label) {
    return '<button class="chip' + (tlFilter === key ? " on" : "") + '" data-act="filter" data-k="' + key + '" aria-pressed="' +
      (tlFilter === key) + '">' + esc(label) + "</button>";
  }

  function about() {
    render(
      topbar("#/", "") + "<h2>Об игре</h2>" +
      '<div class="card"><p>«Выжил бы ты?» — продукт школьного исследовательского проекта «Ключевые различия и сходства в организации тактической (военно-полевой) медицины в России и странах Восточной Азии (Китай, Япония, Корея) с XVIII века до наших дней».</p>' +
      "<p>Все факты, даты и цифры взяты из глав работы, а там — из научных статей и книг. Где точных данных нет, об этом сказано осторожно: «по оценкам», «скорее всего», «по разным подсчётам».</p>" +
      '<p>Истории в игре придуманы, но устроены по правилам своей эпохи. Итог зависит от твоих решений: за каждое верное решение — галочка ✓, за каждого спасённого — сердце ♥, а в конце истории — от одной до трёх звёзд.</p></div>' +
      '<div class="card accent"><div class="section-title">Важно</div><p>Игра не заменяет курс первой помощи. В настоящей беде звони <b>112</b>.</p></div>' +
      '<button class="btn" data-go="#/countries">Начать игру</button>'
    );
  }

  /* ---------- маршруты и клики ---------- */
  function route() {
    var h = location.hash || "#/";
    var m;
    if (h === "#/" || h === "#") return home();
    if (h === "#/countries") return countries();
    if ((m = h.match(/^#\/c\/(\w+)$/))) return scenarioList(m[1]);
    if ((m = h.match(/^#\/s\/(\w+)$/))) { play = null; return intro(m[1]); }
    if (h === "#/play") return showStep();
    if (h === "#/timeline") return timeline();
    if (h === "#/about") return about();
    home();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || b.disabled) return;
    var to = b.getAttribute("data-go");
    if (to) return go(to);
    var act = b.getAttribute("data-act");
    if (act === "start") return start(b.getAttribute("data-id"));
    if (act === "choose") return choose(+b.getAttribute("data-i"));
    if (act === "next") return next();
    if (act === "filter") { tlFilter = b.getAttribute("data-k"); return timeline(); }
    if (act === "reset") { resetScore(); return home(); }
  });
  app.addEventListener("animationend", function (e) {
    var t = e.target;
    if (t.classList) t.classList.remove("shake", "pulse", "bump");
  });

  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
